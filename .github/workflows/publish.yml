name: Publish to NuGet

# One-button release: dispatch this workflow with a version -> it packs,
# publishes StuDev.AotAnywhere to nuget.org, then creates the v<version> tag and
# GitHub release. It does NOT re-run the cross-platform matrix: the commit being
# released has already been validated on its PR, so a second full run at
# release time is wasted CI. (Run
# cross-platform-validation.yml manually if you ever want an extra pre-release
# check.) Dispatched (not tag-triggered) so no PAT is
# needed: GITHUB_TOKEN can trigger workflow_dispatch (unlike a tag push, which it
# is blocked from triggering), and the tag is created here after publish so it
# never needs to trigger anything. A manual `git push` of a v* tag still works as
# a fallback path.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  prepare-toolchain-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: unix
            package-ids: >-
              StuDev.AotAnywhere.Clang.Toolsets.linux-x64,
              StuDev.AotAnywhere.Clang.Toolsets.linux-arm64,
              StuDev.AotAnywhere.Clang.Toolsets.osx-x64,
              StuDev.AotAnywhere.Clang.Toolsets.osx-arm64,
              StuDev.AotAnywhere.Linux.Sysroots.ubuntu-18.04-amd64,
              StuDev.AotAnywhere.Linux.Sysroots.ubuntu-18.04-arm64,
              StuDev.AotAnywhere.Linux.Sysroots.ubuntu-22.04-arm,
              StuDev.AotAnywhere.Linux.Sysroots.alpine-3.17-amd64,
              StuDev.AotAnywhere.Linux.Sysroots.alpine-3.17-arm64,
              StuDev.AotAnywhere.Linux.Sysroots.alpine-3.17-arm
          - runner: windows-latest
            name: windows-x64
            package-ids: StuDev.AotAnywhere.Clang.Toolsets.win-x64
          - runner: windows-latest
            name: windows-arm64
            package-ids: StuDev.AotAnywhere.Clang.Toolsets.win-arm64
    runs-on: ${{ matrix.runner }}
    name: Prepare toolchains (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Download, verify, and pack immutable artifacts
        shell: pwsh
        run: |
          $ids = '${{ matrix.package-ids }}' -split ',' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne '' }
          foreach ($id in $ids) {
            ./eng/build-toolchain-content.ps1 -PackageId $id -OutputDirectory artifacts
          }
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ matrix.name }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish-toolchain-packages:
    needs: prepare-toolchain-packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: toolchain-*
          path: artifacts/toolchains
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push toolchain content packages
        shell: bash
        run: |
          find artifacts/toolchains -name '*.nupkg' -print0 | xargs -0 -r dotnet nuget push \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish:
    needs: publish-toolchain-packages
    # The SDK package is host-independent (one portable netstandard2.0 task DLL).
    # Its currently available toolset/sysroot content packages are published by
    # the prerequisite job. The non-Windows Windows cross-link bundle remains
    # absent until its immutable upstream artifact exists.
    runs-on: windows-latest
    # Trusted publishing: NuGet/login mints a short-lived key from the OIDC
    # token instead of a long-lived nuget.org API key. contents: write is for
    # attaching the .nupkg to the GitHub release.
    environment: release
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Version comes from the dispatch input, or from the tag name on the
      # fallback tag-push path. tag is always v<version>.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned LLVM
        shell: pwsh
        run: |
          $url = 'https://github.com/awakecoding/llvm-prebuilt/releases/download/v2026.2.0/clang%2Bllvm-22.1.4-x86_64-windows.tar.xz'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\llvm" | Out-Null
          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP\llvm" --strip-components=1
          $env:PATH = "$env:RUNNER_TEMP\llvm\bin;$env:PATH"
          "PATH=$env:RUNNER_TEMP\llvm\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Build package-owned Windows cross-link inputs
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\eng\build-aot-crt-stub.ps1" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\aot-crt-stub"
          & "$env:GITHUB_WORKSPACE\eng\build-windows-sdk-imports.ps1" `
            -DllRoot "$env:SystemRoot\System32" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\windows-sdk-imports" `
            -LlvmBinDirectory "$env:RUNNER_TEMP\llvm\bin" `
            -Architecture x64
          & "$env:GITHUB_WORKSPACE\eng\build-windows-sdk-imports.ps1" `
            -DllRoot "$env:SystemRoot\System32" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\windows-sdk-imports" `
            -LlvmBinDirectory "$env:RUNNER_TEMP\llvm\bin" `
            -Architecture arm64
      - name: Pack
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          echo "Packing StuDev.AotAnywhere $version"
          # msvc-dev-cmd sets a Platform=x64 environment variable (from
          # vcvarsall.bat), which MSBuild silently picks up as a global
          # property for every project in this build, including the
          # AotAnywhere.Tasks.csproj project reference. That inserts a
          # platform-name segment into its output path
          # (bin\x64\Release\netstandard2.0 instead of
          # bin\Release\netstandard2.0), which the NuGet pack targets don't
          # expect, so it must be explicitly reset to AnyCPU here.
          dotnet build -t:Pack src/AotAnywhere.nuproj -p:Version="$version" -p:Platform=AnyCPU \
            -p:AotAnywhereAotCrtStubPayloadDir="$RUNNER_TEMP/payload/aot-crt-stub" \
            -p:AotAnywhereWindowsSdkImportsPayloadDir="$RUNNER_TEMP/payload/windows-sdk-imports"
          nupkg=$(find src/bin -name "StuDev.AotAnywhere.$version.nupkg" | head -1)
          if [ -z "$nupkg" ]; then echo "::error::packed nupkg not found for $version" >&2; exit 1; fi
          mkdir -p artifacts
          cp "$nupkg" artifacts/

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, NOT email

      - name: Push to NuGet
        shell: bash
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Tag the published commit and attach the .nupkg to a GitHub release.
      # On the dispatch path the tag does not exist yet, so create it here
      # (pointing at this run's commit) - after publish, so it never needs to
      # trigger anything. On the tag-push path the tag already exists and
      # `gh release create` reuses it. Guarded so a re-run of a partially
      # completed publish updates the release instead of failing 422.
      - name: Tag and attach to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.nupkg --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes artifacts/*.nupkg
          fi
