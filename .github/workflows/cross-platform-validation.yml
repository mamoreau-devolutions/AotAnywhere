name: Cross-Platform Validation

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msbuild-logic-tests:
    runs-on: depot-ubuntu-latest
    name: MSBuild logic unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/AotAnywhere.MSBuild.Tests/AotAnywhere.MSBuild.Tests.csproj -c Release

  package-consumption:
    runs-on: depot-ubuntu-latest
    name: Package consumption (clean NuGet cache)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test the restored Clang/sysroot package graph
        run: bash .github/scripts/test-package-consumption.sh linux-x64

  linux-native-smoke:
    runs-on: depot-ubuntu-latest
    name: Linux Clang smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install the external LLVM smoke toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build the link task
        run: dotnet build src/tasks/AotAnywhere.Tasks/AotAnywhere.Tasks.csproj -c Release
      - name: Publish and launch with external Clang
        run: |
          dotnet publish test/Hello.csproj -r linux-x64 -c Release \
            -p:UseExternalClang=true -p:AotAnywhereLinuxSysroot=/
          test/bin/Release/net8.0/linux-x64/publish/Hello
