name: Cross-Platform Validation

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msbuild-logic-tests:
    runs-on: ubuntu-latest
    name: MSBuild logic unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/AotAnywhere.MSBuild.Tests/AotAnywhere.MSBuild.Tests.csproj -c Release

  package-consumption:
    runs-on: ubuntu-latest
    name: Package consumption (${{ matrix.target-rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-rid: linux-x64
            qemu-platforms: ""
          - target-rid: linux-arm64
            qemu-platforms: arm64
          - target-rid: linux-arm
            qemu-platforms: arm
          - target-rid: linux-musl-x64
            qemu-platforms: ""
          - target-rid: linux-musl-arm64
            qemu-platforms: arm64
          - target-rid: linux-musl-arm
            qemu-platforms: arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Enable target architecture emulation
        if: matrix.qemu-platforms != ''
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu-platforms }}
      - name: Test restored packages and published binary
        run: bash .github/scripts/test-package-consumption.sh linux-x64 ${{ matrix.target-rid }} true

  linux-native-smoke:
    runs-on: ubuntu-latest
    name: Linux Clang smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install the external LLVM smoke toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build the link task
        run: dotnet build src/tasks/AotAnywhere.Tasks/AotAnywhere.Tasks.csproj -c Release
      - name: Publish and launch with external Clang
        run: |
          dotnet publish test/Hello.csproj -r linux-x64 -c Release \
            -p:UseExternalClang=true -p:AotAnywhereLinuxSysroot=/
          test/bin/Release/net8.0/linux-x64/publish/Hello

  windows-crosslink-package:
    runs-on: windows-latest
    name: Build redistributable Windows cross-link package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned LLVM toolset
        shell: pwsh
        run: |
          $url = 'https://github.com/awakecoding/llvm-prebuilt/releases/download/v2026.2.0/clang%2Bllvm-22.1.4-x86_64-windows.tar.xz'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\llvm" | Out-Null
          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP\llvm" --strip-components=1
          $env:PATH = "$env:RUNNER_TEMP\llvm\bin;$env:PATH"
          "PATH=$env:RUNNER_TEMP\llvm\bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Fetch pinned CRT-stub sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\runtime" | Out-Null
          git -C "$env:RUNNER_TEMP\runtime" init -q
          git -C "$env:RUNNER_TEMP\runtime" remote add origin https://github.com/awakecoding/runtime.git
          git -C "$env:RUNNER_TEMP\runtime" sparse-checkout set --cone src/coreclr/nativeaot/Runtime/aotcrtstub
          git -C "$env:RUNNER_TEMP\runtime" fetch --depth 1 --filter=blob:none origin ba0c43c17535ff23bda655bf4300b8514e7ccf67
          git -C "$env:RUNNER_TEMP\runtime" checkout FETCH_HEAD
      - name: Build CRT stubs and Windows SDK import libraries
        shell: pwsh
        run: |
          ./eng/build-aot-crt-stub.ps1 `
            -SourceDirectory "$env:RUNNER_TEMP\runtime\src\coreclr\nativeaot\Runtime\aotcrtstub" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\aot-crt-stub"
          ./eng/build-windows-sdk-imports.ps1 `
            -DllRoot "$env:SystemRoot\System32" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\windows-sdk-imports" `
            -LlvmBinDirectory "$env:RUNNER_TEMP\llvm\bin" `
            -Architecture x64
          ./eng/build-windows-sdk-imports.ps1 `
            -DllRoot "$env:SystemRoot\System32" `
            -OutputDirectory "$env:RUNNER_TEMP\payload\windows-sdk-imports" `
            -LlvmBinDirectory "$env:RUNNER_TEMP\llvm\bin" `
            -Architecture arm64
      - name: Pack AotAnywhere with generated symbol-only inputs
        shell: pwsh
        run: |
          dotnet build -t:Pack src/AotAnywhere.nuproj -p:Version=0.0.0-ci `
            -p:AotAnywhereAotCrtStubPayloadDir="$env:RUNNER_TEMP\payload\aot-crt-stub" `
            -p:AotAnywhereWindowsSdkImportsPayloadDir="$env:RUNNER_TEMP\payload\windows-sdk-imports"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\package" | Out-Null
          Copy-Item src\bin\Debug\StuDev.AotAnywhere.0.0.0-ci.nupkg "$env:RUNNER_TEMP\package\"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-crosslink-package
          path: ${{ runner.temp }}/package/StuDev.AotAnywhere.0.0-ci.nupkg
          if-no-files-found: error

  windows-crosslink-smoke:
    runs-on: ubuntu-latest
    name: Windows cross-link smoke test
    # Exercises the non-Windows Windows-target takeover (lld-link + the
    # AotAnywhereWindowsLink task) end to end using only the generated,
    # package-contained symbol imports and CRT stubs.
    needs: windows-crosslink-package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # win-x64 publishes as net8.0, win-arm64 as net10.0 (newest
          # link.rsp shape). The default (highest) SDK hosts both.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Download and inspect generated package
        uses: actions/download-artifact@v8
        with:
          name: windows-crosslink-package
          path: ${{ runner.temp }}/package
      - name: Extract generated package
        run: |
          mkdir -p "$RUNNER_TEMP/package/extracted"
          unzip -q "$RUNNER_TEMP/package/StuDev.AotAnywhere.0.0.0-ci.nupkg" -d "$RUNNER_TEMP/package/extracted"
          root="$RUNNER_TEMP/package/extracted/build"
          for arch in x86_64 aarch64; do
            test -f "$root/aot-crt-stub/$arch/aotcrtstub.lib"
            test -f "$root/aot-crt-stub/$arch/ntdllcrt.lib"
            test -f "$root/windows-sdk-imports/Lib/um/$arch/kernel32.lib"
            test -f "$root/windows-sdk-imports/Lib/ucrt/$arch/ucrt.lib"
          done
          ! find "$root" -type f \( -name '*.dll' -o -name '*.h' -o -name '*.hpp' -o -name 'libcmt.lib' -o -name 'libvcruntime.lib' \) | grep -q .
      - name: Install LLVM and .NET link prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build the link task
        run: dotnet build src/tasks/AotAnywhere.Tasks/AotAnywhere.Tasks.csproj -c Release
      - name: Publish win-x64 and win-arm64
        run: |
          for rid in win-x64 win-arm64; do
            dotnet publish test/Hello.csproj -r $rid -c Release \
              -p:UseExternalClang=true \
              -p:AotAnywhereClangPath=/usr \
              -p:UseAotCrtStub=true \
              -p:AotAnywhereAotCrtStubPath="$RUNNER_TEMP/package/extracted/build/aot-crt-stub/$([ "$rid" = "win-x64" ] && echo x86_64 || echo aarch64)" \
              -p:AotAnywhereWindowsSdkPath="$RUNNER_TEMP/package/extracted/build/windows-sdk-imports"
          done
      - name: Inspect the produced PE images
        run: |
          # Assert the PE machine types and that the Windows cross-link
          # takeover handed the PDBs to the publish directory
          # (CopyOutputSymbolsToPublishDirectory).
          file test/bin/Release/net8.0/win-x64/publish/Hello.exe
          file test/bin/Release/net8.0/win-x64/publish/Hello.exe | grep -q 'x86-64'
          file test/bin/Release/net10.0/win-arm64/publish/Hello.exe
          file test/bin/Release/net10.0/win-arm64/publish/Hello.exe | grep -qi 'aarch64'
          test -f test/bin/Release/net8.0/win-x64/publish/Hello.pdb
          test -f test/bin/Release/net10.0/win-arm64/publish/Hello.pdb

  windows-crosslink-macos-smoke:
    needs: windows-crosslink-package
    runs-on: macos-latest
    name: macOS Windows cross-link smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: windows-crosslink-package
          path: ${{ runner.temp }}/package
      - name: Extract package and install LLVM
        run: |
          mkdir -p "$RUNNER_TEMP/package/extracted"
          unzip -q "$RUNNER_TEMP/package/StuDev.AotAnywhere.0.0.0-ci.nupkg" -d "$RUNNER_TEMP/package/extracted"
          test -f "$RUNNER_TEMP/package/extracted/build/aot-crt-stub/x86_64/aotcrtstub.lib"
          test -f "$RUNNER_TEMP/package/extracted/build/windows-sdk-imports/Lib/um/x86_64/kernel32.lib"
          brew install llvm
      - name: Publish win-x64 with the package payload
        run: |
          llvm="$(brew --prefix llvm)"
          dotnet publish test/Hello.csproj -r win-x64 -c Release \
            -p:UseExternalClang=true \
            -p:AotAnywhereClangPath="$llvm" \
            -p:UseAotCrtStub=true \
            -p:AotAnywhereAotCrtStubPath="$RUNNER_TEMP/package/extracted/build/aot-crt-stub/x86_64" \
            -p:AotAnywhereWindowsSdkPath="$RUNNER_TEMP/package/extracted/build/windows-sdk-imports"
          file test/bin/Release/net8.0/win-x64/publish/Hello.exe | grep -q 'x86-64'
